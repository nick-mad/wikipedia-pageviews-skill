[project]
name = "wpv"
version = "0.1.0"
description = "Wikipedia pageviews analysis toolkit for the wikipedia-pageviews Agent Skill"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "requests>=2.31",
]

[project.scripts]
wpv = "wpv.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wpv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
